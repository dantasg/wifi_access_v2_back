# 90-accesswifi-api.conf — AccessWifi (NAO e gerado pelo painel; mantido a mao).
# Contexto server. Encaminha as rotas da API para o .NET em 127.0.0.1:5000 — o nginx do
# painel roda com rede "host", entao o localhost dele e o da maquina.
# Tudo o que nao casar aqui cai no "location /" do site: o portal (SPA, com fallback
# para index.html). A lista e a mesma do proxy do Vite (AccessWifi_V2_FRONT/vite.config.ts).
# Os proxy_set_header (Host, X-Forwarded-For, X-Forwarded-Proto) vem do bloco server.
location ~ ^/(authorize|settings)(/|$) {
    proxy_pass http://127.0.0.1:5000;
}
location ~ ^/webhooks/unifi/ {
    proxy_pass http://127.0.0.1:5000;
}
# Avisos da Meta (WhatsApp): até 3 MB por aviso, segundo a Meta (o padrão do nginx é 1 MB).
location ~ ^/webhooks/whatsapp/ {
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:5000;
}
location ~ ^/admin/(login|refresh|logout|leads|settings|system-settings|companies|units|users|campaigns|dashboard|emails|whatsapp|site-contacts)(/|$) {
    proxy_pass http://127.0.0.1:5000;
}
# Formulario de contato do site institucional (PROPOSTA_SITE.md).
location = /site-contact {
    proxy_pass http://127.0.0.1:5000;
}
# Site institucional: arquivos estaticos em index/site/ (dentro da pasta do portal, publicada pelo
# alvo "site" do publicar-producao.sh). Sem fallback para o portal: pagina que nao existe = 404.
location = /site {
    return 301 /site/;
}
location ^~ /site/ {
    try_files $uri $uri/index.html =404;
}
