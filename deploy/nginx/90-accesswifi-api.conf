# 90-accesswifi-api.conf — AccessWifi (NAO e gerado pelo painel; mantido a mao).
# Contexto server. Encaminha as rotas da API para o .NET em 127.0.0.1:5000 — o nginx do
# painel roda com rede "host", entao o localhost dele e o da maquina.
# Tudo o que nao casar aqui cai no "location /" do site: o portal (SPA, com fallback
# para index.html). A lista e a mesma do proxy do Vite (AccessWifi_V2_FRONT/vite.config.ts).
# Os proxy_set_header (Host, X-Forwarded-For, X-Forwarded-Proto) vem do bloco server.
location ~ ^/(authorize|settings)(/|$) {
    proxy_pass http://127.0.0.1:5000;
}
location ~ ^/admin/(login|refresh|logout|leads|settings|companies|units|users)(/|$) {
    proxy_pass http://127.0.0.1:5000;
}
