# AccessWifi — endurecimento do SSH (2026-09-21).
# Prefixo 00: no sshd o PRIMEIRO valor lido vence, e o 50-cloud-init.conf do provedor liga a senha.
# So entra por chave. O root continua podendo entrar, mas nunca por senha.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
